[project]
name = "scanmate"
version = "0.1.0"
description = "Local-first home scanning station for Paperless-ngx consume folders"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pillow>=10,<12",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
scanmate = "scanmate.main:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanmate"]

[tool.setuptools.package-data]
scanmate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
